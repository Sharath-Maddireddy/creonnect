name: CI/CD Docker to AWS EC2 (Python)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  ECR_REPOSITORY: "creonnect-python"

jobs:
  build-and-push:
    name: Build and Push Docker Image to ECR
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # PyTorch and its native dependencies can exhaust the ~14 GB normally
      # available on a hosted runner. These SDKs are not used by this workflow.
      - name: Reclaim runner disk space
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker system prune --all --force
          echo "Disk space after cleanup:"
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image variables
        id: vars
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA}"
          ECR_REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"
          IMAGE_URI="${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          progress: plain
          push: true
          tags: |
            ${{ steps.vars.outputs.image_uri }}
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha,scope=creonnect-python-production
          # Export only the final image layers. The full mode=max cache can
          # upload the ML dependency graph for 20+ minutes and delay deploys.
          # Cache failures are non-blocking because the ECR image is the
          # deployable artifact.
          cache-to: type=gha,mode=min,scope=creonnect-python-production,timeout=5m,ignore-error=true

  deploy:
    name: Deploy Docker on AWS EC2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml"
          target: "${{ secrets.EC2_APP_DIR }}"

      - name: Deploy and restart containers
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_ENV: ${{ secrets.EC2_APP_ENV }}
          APP_DIR: ${{ secrets.EC2_APP_DIR }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          envs: APP_ENV,APP_DIR,AWS_REGION,AWS_ACCOUNT_ID,ECR_REPOSITORY,IMAGE_TAG
          command_timeout: 15m
          script_stop: true
          script: |
            set -euo pipefail
            mkdir -p "${APP_DIR}"
            printf '%s\n' "${APP_ENV}" > "${APP_DIR}/.env"
            chmod 600 "${APP_DIR}/.env"
            cp "${APP_DIR}/docker-compose.prod.yml" "${APP_DIR}/docker-compose.yml"
            ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
            IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
            aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${ECR_REGISTRY}"
            export ECR_IMAGE="${IMAGE_URI}"
            printf 'ECR_IMAGE=%s\n' "${IMAGE_URI}" >> "${APP_DIR}/.env"
            docker compose -f "${APP_DIR}/docker-compose.yml" --env-file "${APP_DIR}/.env" pull
            docker compose -f "${APP_DIR}/docker-compose.yml" --env-file "${APP_DIR}/.env" up -d --remove-orphans
            HEALTH_URL="http://127.0.0.1:8000/health"
            ATTEMPTS=24
            SLEEP_SECONDS=5
            for attempt in $(seq 1 "${ATTEMPTS}"); do
              if curl -fsS "${HEALTH_URL}" >/dev/null; then
                echo "Health check passed on attempt ${attempt}/${ATTEMPTS}"
                break
              fi
              if [ "${attempt}" -eq "${ATTEMPTS}" ]; then
                echo "Health check failed after $((ATTEMPTS * SLEEP_SECONDS)) seconds."
                docker compose -f "${APP_DIR}/docker-compose.yml" --env-file "${APP_DIR}/.env" ps
                docker compose -f "${APP_DIR}/docker-compose.yml" --env-file "${APP_DIR}/.env" logs --tail 200 api worker || true
                exit 1
              fi
              echo "Health check not ready (${attempt}/${ATTEMPTS}); retrying in ${SLEEP_SECONDS}s..."
              sleep "${SLEEP_SECONDS}"
            done
            for service in redis api worker; do
              container_id="$(docker compose -f "${APP_DIR}/docker-compose.yml" --env-file "${APP_DIR}/.env" ps -q "${service}")"
              if [ -z "${container_id}" ] || [ "$(docker inspect --format '{{.State.Status}}' "${container_id}")" != "running" ]; then
                echo "Service ${service} is not running."
                docker compose -f "${APP_DIR}/docker-compose.yml" --env-file "${APP_DIR}/.env" ps
                exit 1
              fi
            done
            docker image prune --force
            docker ps --filter name=creonnect-python-api --filter name=creonnect-python-worker --format "table {{.Names}}\t{{.Image}}\t{{.Status}}"
